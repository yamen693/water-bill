<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>مقسم فاتورة المياه</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 min-h-screen p-6 flex flex-col items-center justify-start space-y-6">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-4xl p-8 space-y-6">
        <h2 class="text-2xl font-bold text-blue-800">💧 مقسم فاتورة المياه</h2>

        <!-- إضافة شخص -->
        <div class="flex flex-col md:flex-row items-center gap-4">
            <input type="text" id="personName" class="flex-1 border border-gray-300 rounded-lg p-2" placeholder="اسم الشخص" />
            <input type="number" id="unpaidAmount" class="flex-1 border border-gray-300 rounded-lg p-2" placeholder="المتبقي (جنيه)" />
            <button onclick="addPerson()" class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded-xl">إضافة شخص</button>
        </div>

        <!-- قائمة الأشخاص -->
        <div id="peopleList" class="text-sm bg-blue-100 p-4 rounded-lg hidden">
            <h3 class="font-bold mb-2 text-blue-700">👥 الأشخاص المضافين:</h3>
            <ul id="peopleUl" class="list-disc pl-5 space-y-1"></ul>
        </div>

        <!-- إدخال إجمالي الفاتورة -->
        <div>
            <label class="block text-gray-700 font-semibold mb-1">إدخال فاتورة المياه الجديدة (جنيه)</label>
            <input type="number" id="totalBill" class="w-full border border-gray-300 rounded-lg p-2" placeholder="مثال: 3000" />
        </div>

        <!-- الأزرار -->
        <div class="flex space-x-3">
            <button onclick="calculate()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-xl">احسب</button>
            <button onclick="resetAll()" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold py-2 px-4 rounded-xl">إعادة تعيين</button>
        </div>

        <!-- النتائج -->
        <div id="output" class="text-gray-800 space-y-4"></div>
        <div class="flex space-x-3">
            <button onclick="calculate()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-xl">احسب</button>
            <button onclick="resetAll()" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold py-2 px-4 rounded-xl">إعادة تعيين</button>
            <button id="downloadPdfBtn" onclick="downloadPDF()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-xl hidden">
              تحميل النتائج PDF
            </button>
          </div>
          

 <!-- مثال لزر الترجمة -->
<a href="index.html" class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg shadow-md transition-colors duration-200">

🌐 Switch to English
</a>

     
    </div>
<!-- قبل سكربتك -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>

    <script>
        const people = [];

        function addPerson() {
            const name = document.getElementById("personName").value.trim();
            const unpaid = parseFloat(document.getElementById("unpaidAmount").value);

            if (!name || isNaN(unpaid) || unpaid < 0) {
                alert("يرجى إدخال اسم صحيح ومبلغ متبقي.");
                return;
            }

            people.push({ name, unpaid });
            document.getElementById("personName").value = "";
            document.getElementById("unpaidAmount").value = "";

            updatePeopleList();
        }

        function updatePeopleList() {
            const list = document.getElementById("peopleUl");
            const container = document.getElementById("peopleList");
            list.innerHTML = "";
            people.forEach(p => {
                const li = document.createElement("li");
                li.textContent = `${p.name}: ${p.unpaid.toFixed(2)} جنيه`;
                list.appendChild(li);
            });
            container.classList.remove("hidden");
        }

        function calculate() {
            const totalBill = parseFloat(document.getElementById("totalBill").value);
            const output = document.getElementById("output");
            output.innerHTML = "";

            if (people.length === 0) {
                output.innerHTML = `<div class="text-red-600 font-semibold">⚠️ أضف شخصًا أولاً.</div>`;
                return;
            }

            if (isNaN(totalBill) || totalBill < 0) {
                output.innerHTML = `<div class="text-red-600 font-semibold">⚠️ أدخل مبلغ صحيح للفاتورة.</div>`;
                return;
            }

            const totalUnpaid = people.reduce((sum, p) => sum + p.unpaid, 0);
            const difference = Math.abs(totalBill - totalUnpaid);
            const share = difference / people.length;

            let summary = `
                <div class="bg-blue-100 rounded-lg p-4">
                    <p class="font-medium">📊 المجموع المتبقي من الفواتير السابقة: <strong>${totalUnpaid.toFixed(2)} جنيه</strong></p>
                    <p class="font-medium">🧮 الفرق بين الفاتورة الجديدة والمجموع المتبقي: <strong>${difference.toFixed(2)} جنيه</strong></p>
                    <p class="font-medium">💧 حصة كل شخص من الفاتورة الجديدة: <strong>${share.toFixed(2)} جنيه</strong></p>
                </div>
            `;

            let tableRows = people.map(p => {
                const totalDue = p.unpaid + share;
                return `
                    <tr class="border-b">
                        <td class="py-2 px-4">${p.name}</td>
                        <td class="py-2 px-4 text-center">${p.unpaid.toFixed(2)}</td>
                        <td class="py-2 px-4 text-center">${share.toFixed(2)}</td>
                        <td class="py-2 px-4 text-center font-semibold text-blue-700">${totalDue.toFixed(2)}</td>
                    </tr>
                `;
            }).join("");

            const tableHTML = `
                <div>
                    <h3 class="text-lg font-bold mt-4 mb-2 text-gray-800">📌 المبلغ النهائي المستحق لكل شخص</h3>
                    <table class="w-full border border-gray-300 rounded-lg overflow-hidden text-sm">
                        <thead class="bg-blue-100">
                            <tr>
                                <th class="py-2 px-4 text-left">الاسم</th>
                                <th class="py-2 px-4 text-center">المتبقي (جنيه)</th>
                                <th class="py-2 px-4 text-center">الحصة النهائية (جنيه)</th>
                                <th class="py-2 px-4 text-center">المجموع المستحق (جنيه)</th>
                            </tr>
                        </thead>
                        <tbody>${tableRows}</tbody>
                    </table>
                </div>
            `;

            output.innerHTML = summary + tableHTML;
        }

        function resetAll() {
            document.getElementById("personName").value = "";
            document.getElementById("unpaidAmount").value = "";
            document.getElementById("totalBill").value = "";
            document.getElementById("peopleUl").innerHTML = "";
            document.getElementById("peopleList").classList.add("hidden");
            document.getElementById("output").innerHTML = "";
            people.length = 0;
        }
        function downloadPDF() {
            const element = document.getElementById('output');
            html2pdf()
              .set({ margin:       0.5,
                     filename:     'water-bill.pdf',
                     image:        { type: 'jpeg', quality: 0.98 },
                     html2canvas:  { scale: 2 },
                     jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
              })
              .from(element)
              .save();
          }
          document.getElementById('downloadPdfBtn').classList.remove('hidden');

    </script>

</body>
</html>
